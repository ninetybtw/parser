[project]
name = "leadgen"
version = "0.1.0"
description = "Полуавтоматический поиск лидов по нише и подготовка персональных предложений (отправка — вручную)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "httpx2>=2.13",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pillow>=10",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
screenshots = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
leadgen = "leadgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadgen*"]

[tool.setuptools.package-data]
leadgen = ["mockup/templates/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
